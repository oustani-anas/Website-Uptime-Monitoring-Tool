services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: uptime-monitor-backend   # shared with the worker: one image, two commands
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ./backend
    image: uptime-monitor-backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      # api healthy => migrations have been applied
      api:
        condition: service_healthy
    healthcheck:
      # The worker touches this file on every loop iteration; stale file => loop is stuck.
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
