# Production override, used ONLY on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local development:
#   - Caddy is the only public entry point (80/443) and gets HTTPS certificates
#     from Let's Encrypt automatically for SITE_DOMAIN.
#   - The api (8000) and frontend (8080) ports are no longer published on the host;
#     they're only reachable inside the Docker network. Postgres was never published.
services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env, e.g. myapp.westeurope.cloudapp.azure.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates (keep them: Let's Encrypt has rate limits)
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  api:
    ports: !reset []

  frontend:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
