<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2310b981'/></svg>" />
    <title>Uptime Monitor</title>
    <script>
      // Apply the theme before first paint to avoid a light flash in dark mode.
      // Saved choice wins; otherwise follow the OS setting. (Mirrors src/hooks/useTheme.ts.)
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
