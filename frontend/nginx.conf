server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API (and its interactive docs) -> FastAPI. Same origin for the browser: no CORS.
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts content hashes in asset filenames -> safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: unknown paths (e.g. /monitors/3) serve index.html; React Router takes over.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
