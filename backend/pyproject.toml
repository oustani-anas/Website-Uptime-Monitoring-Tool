# Tool configuration only. The backend is not installed as a package;
# dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole test session, so the session-scoped DB engine
# (tests/conftest.py) can be shared by every test and fixture.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
